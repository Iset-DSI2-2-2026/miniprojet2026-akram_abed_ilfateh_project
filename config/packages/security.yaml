security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_home

    access_control:
        # Pages accessible without login (public)
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        
        # Pages that require login
        - { path: ^/livre, roles: ROLE_USER }
        - { path: ^/auteur, roles: ROLE_USER }
        - { path: ^/genre, roles: ROLE_USER }
        - { path: ^/tag, roles: ROLE_USER }
        
        # If no match, require login
        - { path: ^/, roles: ROLE_USER }

    role_hierarchy:
        ROLE_BIBLIOTHECAIRE: ROLE_USER
        ROLE_ADMIN: ROLE_BIBLIOTHECAIRE

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
